name: Build

# Pushes to main and pull requests build, test and pack. Pushing a version tag (v0.7.0)
# also publishes that version to nuget.org.
on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write  # lets NuGet/login trade a GitHub OIDC token for a temporary API key

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # v0.7.0 -> 0.7.0, passed to every build so the package and assembly carry the tag's version.
    - name: Version from tag
      if: github.ref_type == 'tag'
      run: echo "VERSION_ARG=-p:Version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV

    - name: Test
      run: dotnet test Cestyll.Ecs.slnx --configuration Release $env:VERSION_ARG

    - name: Pack
      run: dotnet pack src/Cestyll.Ecs/Cestyll.Ecs.csproj --configuration Release --no-build --output artifacts $env:VERSION_ARG

    - name: NuGet login
      if: github.ref_type == 'tag'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      if: github.ref_type == 'tag'
      run: dotnet nuget push artifacts\*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate --source https://api.nuget.org/v3/index.json
